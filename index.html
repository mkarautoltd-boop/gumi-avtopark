<!doctype html>
<html lang="bg" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b111d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Гуми">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Гуми Автопарк</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@700&display=swap">
<style>
:root{--navy:#0b1f3a;--navy2:#15325c;--bg:#f2f4f8;--card:#ffffff;--txt:#1b2433;--mut:#5f6b7c;--line:#dde2ea;
--soft:#eef2f8;--soft2:#e6ebf2;--ic:#e9eef6;--okbg:#e3f6ed;--warnbg:#fdf1dc;--warntx:#9a6200;--badbg:#fde6e7;--infobg:#e3edff;--sumbg:#fdecdc;--sumtx:#a4520f;
--cbd:transparent;--ok:#1a9a60;--warn:#e09612;--bad:#d9434a;--blue:#2f6fed;--vio:#7457e8;--teal:#0f9a9a;--org:#e0782a;--win:#2f6fed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1a2335;--card:#3a4d72;--txt:#f3f6fb;--mut:#c3cddd;--line:#52678f;--soft:#2e3f5e;--soft2:#4a5f88;--ic:#4a5f88;--cbd:rgba(255,255,255,.14);--okbg:#123626;--warnbg:#3a2c12;--warntx:#f2b84b;--badbg:#3d1a1d;--infobg:#17294a;--sumbg:#3a2616;--sumtx:#f0a766;--ok:#3fcf8e;--bad:#f06a70;--win:#6a9cff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1a2335;--card:#3a4d72;--txt:#f3f6fb;--mut:#c3cddd;--line:#52678f;--soft:#2e3f5e;--soft2:#4a5f88;--ic:#4a5f88;--cbd:rgba(255,255,255,.14);--okbg:#123626;--warnbg:#3a2c12;--warntx:#f2b84b;--badbg:#3d1a1d;--infobg:#17294a;--sumbg:#3a2616;--sumtx:#f0a766;--ok:#3fcf8e;--bad:#f06a70;--win:#6a9cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));font-size:15px}
.demo{background:#f0a020;color:#1b1400;font-size:13px;font-weight:600;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.demo .sw{display:flex;gap:4px}
.demo button{border:0;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px;background:rgba(0,0,0,.12);color:#1b1400;cursor:pointer}
.demo button.on{background:#1b1400;color:#f0a020}
header{background:linear-gradient(160deg,var(--navy),var(--navy2));color:#fff;padding:14px 16px 20px;border-radius:0 0 22px 22px;position:relative;overflow:hidden}
header::before{content:'';position:absolute;right:-70px;top:-70px;width:210px;height:210px;border-radius:50%;border:26px dashed rgba(255,255,255,.07);pointer-events:none}
header::after{content:'';position:absolute;right:-12px;top:-12px;width:94px;height:94px;border-radius:50%;border:10px solid rgba(255,255,255,.05);pointer-events:none}
header>*{position:relative;z-index:1}
.top{display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top small{opacity:.75;font-size:13px}
.back{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:20px;width:36px;height:36px;border-radius:10px;cursor:pointer;flex:none}
.counters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.cnt{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 4px;text-align:center}
.cnt b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.cnt span{font-size:11px;opacity:.8}
.season{margin-top:12px;background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;font-size:13px}
.season .bar{height:8px;border-radius:4px;background:rgba(0,0,0,.25);margin-top:8px;overflow:hidden}
.season .bar i{display:block;height:100%;background:#6aa7ff;border-radius:4px}
main{padding:16px;max-width:720px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.tile{border:0;border-radius:18px;color:#fff;padding:16px 6px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-family:inherit;background-image:linear-gradient(150deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%,rgba(0,0,0,.14));box-shadow:0 8px 16px -8px rgba(11,31,58,.55);transition:transform .12s ease}
.tile:active,.szc:active{transform:scale(.96)}
.tile{min-width:0;text-align:center;line-height:1.2}
.tile i{font-style:normal;font-size:22px;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center}
h2{font-size:12px;margin:22px 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:800}
.plt{--h:22px;display:inline-flex;align-items:stretch;height:var(--h);border:1.5px solid #111;border-radius:5px;background:#fff;box-shadow:inset 0 0 0 1.5px #fff,inset 0 0 0 2.5px #222,0 1px 2px rgba(0,0,0,.25);color:#111;overflow:hidden;white-space:nowrap;max-width:100%;font-family:"PT Sans Narrow","Arial Narrow",sans-serif;font-weight:700;line-height:1}
.plt i{background:#003399;color:#fff;font-style:normal;width:calc(var(--h)*.52);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:2px 0}
.plt i svg{width:78%;height:auto;display:block}
.plt i b{font-size:calc(var(--h)*.3);font-weight:700;letter-spacing:0;font-family:"PT Sans Narrow","Arial Narrow",sans-serif}
.plt>span{display:flex;align-items:center;padding:0 calc(var(--h)*.28);font-size:calc(var(--h)*.74);letter-spacing:.02em;word-spacing:.08em;color:#111}
.plt.big{--h:38px;border-radius:6px}
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 14px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;background:conic-gradient(#7db4ff calc(var(--p)*1%),rgba(255,255,255,.14) 0);display:grid;place-items:center}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--navy2);display:grid;place-items:center;font-size:13px}
.axle{display:grid;grid-template-columns:1fr 70px 1fr;grid-template-rows:auto auto;gap:8px 10px;margin-top:12px;align-items:stretch}
.axle .body{grid-column:2;grid-row:1/3;display:flex;align-items:center;justify-content:center}
.axle .body svg{width:62px;height:auto}
.card{background:var(--card);border:1px solid var(--cbd);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mc{display:flex;gap:12px;align-items:center;cursor:pointer}
.mc .ic{width:42px;height:42px;border-radius:12px;background:var(--ic);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.mc .t{flex:1;min-width:0}
.mc .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate{letter-spacing:.03em}
.mut{color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;padding:4px 8px;border-radius:20px;white-space:nowrap}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warntx)}.b-bad{background:var(--badbg);color:var(--bad)}
.b-win{background:var(--infobg);color:var(--win)}.b-sum{background:var(--sumbg);color:var(--sumtx)}.b-soft{background:var(--soft2);color:var(--mut)}
.bdg{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
label.chk{display:flex;gap:10px;align-items:center;color:var(--txt);margin:0;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
label.chk input{width:22px;height:22px}
input,select,textarea{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--txt);font-family:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
textarea{min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:var(--blue);margin-top:16px;cursor:pointer}
.btn.sec{background:var(--soft2);color:var(--txt)}
.calc{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:14px;line-height:1.6}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv:last-child{border:0}
.kv b{text-align:right}
.search{margin-bottom:12px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:14px;border-radius:12px;text-align:center;font-weight:600;z-index:9}
.toast.err{background:var(--bad)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 18px -8px rgba(11,31,58,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:720px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabbar button{border:0;background:none;color:var(--mut);font-family:inherit;font-size:11px;font-weight:700;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;min-height:58px}
.tabbar svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--blue)}
.tabbar button[aria-current="page"]::before{content:'';position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.tabbar i{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-style:normal;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.center{text-align:center;padding:40px 10px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin:10px 0}
.tabs button{flex:1;border:0;border-radius:10px;padding:10px;background:var(--soft2);color:var(--txt);font-weight:600;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff}
.step{display:flex;gap:10px;align-items:center}
.step .t{flex:1;min-width:0}
.step button{border:0;border-radius:10px;padding:10px 12px;min-width:104px;min-height:44px;font-weight:700;font-size:14px;cursor:pointer;background:var(--navy);color:#fff}
.step button.done{background:var(--okbg);color:var(--ok);cursor:default}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--soft2)}
.dots i.on{background:var(--blue)}
.dots i.fin{background:var(--ok)}
.set{border-radius:12px;padding:12px;margin-bottom:10px;background:var(--soft)}
.set.mnt{box-shadow:inset 0 0 0 2px var(--win)}
.set.mnt.sum{box-shadow:inset 0 0 0 2px var(--org)}
.set .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.tread{height:8px;border-radius:4px;background:var(--soft2);margin:8px 0 4px;overflow:hidden}
.tread i{display:block;height:100%;border-radius:4px}
.set.miss{background:var(--badbg)}
.tires{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.tire{border:0;border-radius:10px;min-height:50px;padding:6px 2px;font-size:13px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit}
.tire span{font-size:11px;font-weight:600}
.tire.ok{background:var(--okbg);color:var(--ok)}.tire.worn{background:var(--warnbg);color:var(--warntx)}.tire.scrap{background:var(--badbg);color:var(--bad)}
.tire:disabled{cursor:default}
.setbtns{display:flex;gap:8px;margin-top:10px}
.setbtns button{flex:1;border:0;border-radius:10px;min-height:44px;font-weight:700;font-size:14px;cursor:pointer;background:var(--navy);color:#fff;font-family:inherit}
.ord{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.ord:last-child{border:0}
button.ord{width:100%;background:none;border-width:0 0 1px;border-style:solid;border-color:var(--line);color:inherit;font:inherit;text-align:left;cursor:pointer}
button.ord:last-child{border:0}
.szgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.szc{background:var(--card);border:1px solid var(--cbd);border-top:4px solid var(--acc,var(--line));border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 14px -10px rgba(11,31,58,.35);display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;color:var(--txt);font-family:inherit;cursor:pointer;min-width:0;transition:transform .12s ease}
.szc .sz{font-weight:800;font-size:15px;letter-spacing:.01em}
.szc .n{font-size:30px;font-weight:800;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:6px}
.szc .n small{font-size:13px;font-weight:600;color:var(--mut)}
.szc .sets{display:flex;gap:10px;font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.szc .tb{display:flex;flex-wrap:wrap;gap:4px}
@media (min-width:560px){.szgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fset{display:flex;flex-direction:column;gap:6px}
.fset .row2{display:flex;gap:8px;margin-top:4px;width:100%}
.fset .row2 button{flex:1;border:0;border-radius:10px;min-height:44px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;background:var(--navy);color:#fff}
.fset .row2 button.sec{background:var(--soft2);color:var(--txt)}
.fset .row2 button.red{background:var(--badbg);color:var(--bad)}
.fset .row2 button.cfm,.btn.cfm{background:var(--org);color:#fff}
.dots4{display:flex;gap:4px}.dots4 i{width:14px;height:14px;border-radius:50%;background:var(--ok)}.dots4 i.worn{background:var(--warn)}.dots4 i.scrap{background:var(--bad)}.dots4 i.none{background:var(--soft2)}
.legal{display:block;width:100%;text-align:left;border:0;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-family:inherit;font-size:14px;line-height:1.4;cursor:pointer;color:var(--txt)}
.legal b{display:block;font-size:15px;margin-bottom:2px}
.legal.warn{background:var(--warnbg);box-shadow:inset 4px 0 0 var(--warn)}
.legal.bad{background:var(--badbg);box-shadow:inset 4px 0 0 var(--bad)}
.legal.ok{background:var(--okbg);color:var(--ok);font-weight:700;cursor:default}
.setmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:8px;font-size:13px;color:var(--mut)}
.setmeta b{color:var(--txt)}
.rimb{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:20px;padding:6px 12px;min-height:36px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.rimb.on{background:var(--infobg);color:var(--win);border-color:transparent}
.rimb:disabled{cursor:default}
.rimb.cfmr{background:var(--org);color:#fff;border-color:transparent}
.bill{padding:4px 12px}
.brow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line)}
.bchk{display:flex;align-items:center;gap:10px;flex:1;min-width:0;margin:0;color:var(--txt);font-size:14px;font-weight:600}
.bchk input[type=checkbox]{width:22px;height:22px;flex:none}
.bchk .bn{padding:8px 10px;font-size:14px}
.bq{width:46px;padding:8px 4px;text-align:center;font-size:15px}
.bp{width:64px;padding:8px 6px;text-align:right;font-size:15px}
.bx{font-size:12px;color:var(--mut);white-space:nowrap}
.btot{text-align:right;padding:10px 0 6px;font-size:15px}
.btot b{font-size:20px}
.bbase{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0}
.bbase button{border:1px solid var(--line);background:var(--soft);color:var(--txt);border-radius:16px;padding:10px 8px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:64px}
.bbase button small{font-size:18px;font-weight:800}
.bbase button.on{background:var(--navy);color:var(--lime);border-color:transparent}
.plink{border:0;background:none;color:var(--win);font:inherit;font-weight:700;font-size:14px;padding:4px 0 10px;cursor:pointer;text-align:left}
.pedit{background:var(--soft);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.pedit .prow{padding:8px 0}
.row2b{display:flex;gap:8px;margin-top:6px}
.row2b button{flex:1;border:0;border-radius:14px;min-height:44px;font:inherit;font-weight:800;cursor:pointer;background:var(--lime);color:var(--limeink)}
.row2b button.sec{background:var(--soft2);color:var(--txt)}
.bxl{font-size:13px;color:var(--mut);font-weight:700;margin:4px 0 8px}
.bext{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px}
.echip{position:relative;margin:0;display:inline-flex}
.echip input{position:absolute;opacity:0;width:1px;height:1px}
.echip span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:20px;background:var(--soft);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--txt);cursor:pointer}
.echip input:checked+span{background:var(--org);border-color:transparent;color:#fff}
.echip input:checked+span::before{content:'✓ '}
.echip input:focus-visible+span{outline:2px solid var(--win);outline-offset:2px}
.eoth{flex:1;min-width:120px;padding:8px 12px;font-size:14px;min-height:40px}
.bsum{border-top:1px solid var(--line);padding:10px 0 8px}
.bsum label{margin-top:0}
.bsumin{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bsumin input{font-size:26px;font-weight:800;text-align:right;max-width:160px}
.bsumin span{font-size:22px;font-weight:800}
.srow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sdel{border:0;background:var(--badbg);color:var(--bad);width:44px;height:44px;border-radius:12px;font-weight:800;cursor:pointer;flex:none}
.prow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child,.brow:last-of-type{border-bottom:0}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--infobg);color:var(--win);border:0;border-radius:20px;padding:8px 14px;font-weight:700;font-size:14px;margin-bottom:10px;cursor:pointer;font-family:inherit}
.ord b{font-size:16px;white-space:nowrap}
.hist{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist:last-child{border:0}
.hist .d{width:78px;flex:none;color:var(--mut);font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:380px){.cnt b{font-size:18px}.tile{font-size:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* ===== Визия „Аврора“: стъклени карти над светещ фон, плаващо меню, лайм акцент ===== */
:root{color-scheme:light;--bg:#eaeef4;--glow1:rgba(120,220,255,.55);--glow2:rgba(198,244,50,.45);--glow3:rgba(150,120,255,.28);
--card:rgba(255,255,255,.72);--cbd:rgba(255,255,255,.95);--txt:#0f1626;--mut:#4f5a6e;--line:rgba(15,22,38,.1);--soft:rgba(15,22,38,.05);--soft2:rgba(15,22,38,.08);--ic:rgba(15,22,38,.06);

<script>
/* ===== ДЕМО: примерна база в паметта (в истинското приложение това е Google Sheets) ===== */
const USER = { name: '', role: '', username: '', hasPass: false };
let TARGET = 'winter';   // сезонът, към който сменяме сега — идва от сървъра
const SETN = { summer: 'Летни', winter: 'Зимни', all: 'Всесезонни' };
const LIMIT = { summer: 1.6, winter: 4, all: 4 };
const NEWD = { summer: 8, winter: 9, all: 8.5 };   // дълбочина на нова гума, мм
const ICO = { summer: '☀️', winter: '❄️', all: '🌦️' };
let ROT_KM = 10000;   // ротация предни ↔ задни — идва от сървъра (лист „Настройки“)
const r1 = n => Math.round(n * 10) / 10;
const numv = x => { const n = parseFloat(String(x).replace(',', '.')); return isNaN(n) ? 0 : n; };
const todayStr = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const dayShift = k => { const d = new Date(); d.setDate(d.getDate() + k); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

const kinds = c => c.allSeason ? ['all'] : ['winter', 'summer'];
const ageOf = s => s && s.dot ? YEAR - +s.dot : 0;

let DB = null;   // идва от сървъра

/* ---------- Логика (в истинското приложение е в Apps Script) ---------- */
const carById = id => DB.cars.find(c => c.id === id);

const other = s => s === 'summer' ? 'winter' : 'summer';

const kmOf = (c, k) => { const s = c.sets[k]; if (!s) return 0; return (s.kmRun || 0) + (c.mounted === k ? Math.max(0, (c.odo || c.km) - c.km) : 0); };
const sub_ = (...a) => a.map(x => String(x == null ? '' : x).trim()).filter(x => x && x !== '—').join(' · ');
function setLine(s, short) {
  const a = ageOf(s), col = a >= 10 ? 'var(--bad)' : 'var(--warn)';

  return [short ? '' : esc(s.size), s.brand && s.brand !== '—' ? esc(s.brand) : '', dot].filter(Boolean).join(' · ');
}
const isTodo = c => !c.size || kinds(c).every(k => !c.sets[k]);
const kmMan = c => c.manual || !c.roadKm;   // км се пишат на ръка: кола извън пътната книжка или още без км там
const kmFmt = n => Math.round(n).toLocaleString('bg-BG') + ' км';
// ротация: колко км остават до следващата (отрицателно = просрочена)
const rotLeft = (c, k) => { const s = c.sets[k]; return s ? ROT_KM - (kmOf(c, k) - (s.rotAt || 0)) : null; };
const rotDue = c => { const k = c.mounted, l = rotLeft(c, k); return l != null && l <= 1000 ? l : null; };

const rotBadge = c => { const l = rotDue(c); return l == null ? '' : `<span class="badge ${l < 0 ? 'b-bad' : 'b-warn'}">🔄 ротация</span>`; };
const POS = ['ПЛ', 'ПД', 'ЗЛ', 'ЗД'];
const CAR_SVG = `<svg viewBox="0 0 60 120" aria-hidden="true"><rect x="7" y="4" width="46" height="112" rx="17" style="fill:var(--soft2);stroke:var(--mut)" stroke-width="2"/><path d="M14 36 Q30 26 46 36 L44 50 Q30 45 16 50 Z" style="fill:var(--mut)" opacity=".45"/><path d="M16 92 Q30 96 44 92 L45 102 Q30 108 15 102 Z" style="fill:var(--mut)" opacity=".35"/><path d="M30 8 l-5 7 h10 z" style="fill:var(--mut)"/></svg>`;
const POSF = ['предна лява', 'предна дясна', 'задна лява', 'задна дясна'];

const have = s => s ? s.tires.filter(t => t !== 'scrap').length : 0;
const need = s => s ? s.tires.filter(t => t !== 'ok').length : 4;
// проблеми по комплект: няма комплект, бракувани, за смяна или нисък протектор
function setIssue(c, k) {

function carSelect(onlyWaiting) {
  const list = DB.cars.slice().sort((a, b) => a.plate.localeCompare(b.plate));
  return `<label for="f_car">Кола</label><select id="f_car" onchange="S.sel=this.value;render()"><option value="">— избери —</option>${
    list.map(c => `<option value="${c.id}" ${S.sel === c.id ? 'selected' : ''}>${esc(c.plate)} · ${esc(c.model)}</option>`).join('')}</select>`;
}
const opts = (arr, cur) => arr.map(x => `<option ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('');
const STEP_TXT = ['Чака', 'В буса', 'Сменени', 'Готово'];
function dots(step) { return `<div class="dots">${[1, 2, 3].map(k => `<i class="${step >= k ? (step === 3 ? 'fin' : 'on') : ''}"></i>`).join('')}</div>`; }
function tripSummary(t) {
  const n = t.items.length, s = k => t.items.filter(x => x.step >= k).length;
  return `натоварени ${s(1)} · сменени ${s(2)} · прибрани ${s(3)} от ${n}`;
}

const V = {
  home() {
    header('Гуми Автопарк');
    // бързи действия: само неща, които ги няма в долните табове
    const tiles = [
      ['🔧', 'Смяна', "go('change',{sel:'',fromTrip:''})", 'var(--org)'],
      ['🚚', 'Нов рейс', "go('newTrip',{picked:[]})", 'var(--blue)'],
      ['🛞', 'Свободни гуми', "go('addFree')", 'var(--teal)'],
      ['🧾', 'Разход', "go('expense',{sel:''})", 'var(--bad)']
    ];
    let h = canEdit() ? `<div class="tiles" style="grid-template-columns:repeat(4,1fr)">${tiles.map(t => `<button class="tile" style="background-color:${t[3]}" onclick="${t[2]}"><i>${t[0]}</i>${t[1]}</button>`).join('')}</div>` : '';
    h = legalBanner() + h;
    const todo = DB.cars.filter(isTodo);
    if (todo.length && canEdit()) h += `<h2>Въведи гумите (${todo.length})</h2><div class="mut" style="margin:-4px 0 10px">Отвори колата, сложи размера и въведи гумите, които има.</div>`
      + carGrid(todo.slice(0, 6), c => carTile(c, c.size || 'няма размер')) + (todo.length > 6 ? `<button class="btn sec" style="margin-top:0" onclick="go('cars',{tab:'todo',size:'',q:''})">Виж всички ${todo.length}</button>` : '');
    h += `<h2>Гуми за купуване</h2>` + orderCard();
    h += `<h2>Коли по размер гуми</h2>` + sizesCard();
    const open = DB.trips.filter(t => !tripDone(t));
    h += `<h2>Рейсове за сервиз (${open.length})</h2>` + (open.length ? tripGrid(open) : '<div class="card mut">Няма активни рейсове.</div>');
    const bad = DB.cars.filter(c => !isTodo(c) && issues(c).length).sort((a, b) => issues(b).filter(x => x.lvl === 'bad').length - issues(a).filter(x => x.lvl === 'bad').length);
    if (bad.length) h += `<h2>Проблеми с гумите (${bad.length})</h2>` + carGrid(bad);
    const rot = DB.cars.filter(c => rotDue(c) != null).sort((a, b) => rotDue(a) - rotDue(b));
    if (rot.length) h += `<h2>За ротация предни ↔ задни (${rot.length})</h2>` + carGrid(rot, c => carTile(c, `${SETN[c.mounted]} · ${rotTxt(rotDue(c))}`, `<span class="badge ${rotDue(c) < 0 ? 'b-bad' : 'b-warn'}">🔄 ${rotDue(c) < 0 ? 'просрочена' : 'скоро'}</span>`));
    const waiting = DB.cars.filter(c => !isTodo(c) && !c.allSeason && c.mounted !== TARGET && !tripOf(c.id));
    h += `<h2>Чакат смяна, без рейс (${waiting.length})</h2>` + carGrid(waiting.slice(0, 8), c => carTile(c, sub_(c.size, c.service)));
    if (waiting.length > 8) h += `<button class="btn sec" style="margin-top:0" onclick="go('cars',{tab:'wait'})">Виж всички ${waiting.length}</button>`;
    return h;
  },

  trips() {
    header('Натоварване', 'home');
    let h = canEdit() ? `<button class="btn" style="margin:0 0 12px" onclick="go('newTrip',{picked:[]})">+ Нов рейс</button>` : '';
    const open = DB.trips.filter(t => !tripDone(t)), done = DB.trips.filter(tripDone);
    h += open.length ? tripGrid(open) : '<div class="card mut">Няма активни рейсове.</div>';
    if (done.length) h += '<h2>Приключени</h2>' + tripGrid(done);
    return h;
  },

  trip() {
    const t = DB.trips.find(x => x.id === S.trip); if (!t) return go('trips');
    header(`${t.bus} → ${t.service}`, 'trips');
    let h = `<div class="card"><div class="kv"><span>Дата</span><b>${fmt(t.date)}</b></div><div class="kv"><span>Карат се</span><b>${SETN[TARGET]} гуми</b></div><div class="kv"><span>Връщат се в склада</span><b>${SETN[other(TARGET)]} гуми</b></div><div class="kv"><span>Прогрес</span><b>${tripSummary(t)}</b></div></div>
      <div class="mut" style="margin:4px 0 10px">Натисни при всяка стъпка: натоварих → сменени (попълва км и протектор) → прибрах в склада.</div>`;
    h += t.items.map(it => {
      const c = carById(it.carId), ts = c.sets[TARGET] || {};
      const btn = it.step === 3 ? `<button class="done" disabled>✔ Готово</button>`
        : it.step === 1 ? `<button onclick="doChange('${t.id}','${c.id}')">Сменени</button>`
        : `<button onclick="advance('${t.id}','${c.id}')">${it.step === 0 ? 'Натоварих' : 'Прибрах'}</button>`;
      return `<div class="card"><div class="step"><div class="t" onclick="openCar('${c.id}')" style="cursor:pointer">${plateHtml(c.plate)} <span class="badge ${it.step === 3 ? 'b-ok' : it.step ? 'b-warn' : 'b-soft'}">${STEP_TXT[it.step]}</span>
        <div class="mut">${esc(c.model)} · ${esc(ts.size || c.size)} · ${esc(ts.brand || '—')}</div>${ts.rims ? '<span class="badge b-soft">🛞 на джанти</span>' : '<span class="badge b-warn">без джанти · монтаж</span>'}</div>${btn}</div>${dots(it.step)}</div>`;
    }).join('');
    return h;
  },

  newTrip() {
    header('Нов рейс', 'trips');
    const pool = DB.cars.filter(c => !c.allSeason && c.mounted !== TARGET && !tripOf(c.id) && c.sets[TARGET]);
    const noSet = DB.cars.filter(c => !c.allSeason && c.mounted !== TARGET && !c.sets[TARGET]).length;
    let h = `<div class="row"><div><label for="f_bus">Бус</label><select id="f_bus">${opts(DB.buses)}</select></div>
      <div><label for="f_srv">Сервиз</label><select id="f_srv">${opts(DB.services)}</select></div></div>
      <label for="f_date">Дата</label><input type="date" id="f_date" value="${dayShift(1)}">
      ${noSet ? `<div class="calc" style="background:var(--badbg)">${noSet} коли нямат ${SETN[TARGET].toLowerCase()} гуми и не са в списъка. Добави им комплект от картата на колата.</div>` : ''}
      <h2>Коли за рейса (${S.picked.length} избрани)</h2><div class="card">`;
    h += pool.map(c => `<label class="chk"><input type="checkbox" ${S.picked.includes(c.id) ? 'checked' : ''} onchange="togglePick('${c.id}')"><span style="flex:1"><b class="plate">${esc(c.plate)}</b> <span class="mut">${esc(c.model)} · ${esc(c.service)} · ${c.sets[TARGET].rims ? 'джанти' : 'без джанти'}</span></span></label>`).join('') || '<div class="mut">Всички коли са сменени или вече са в рейс.</div>';
    return h + `</div><button class="btn" onclick="saveTrip()">Създай рейса</button>`;
  },

  change() {
    header('Смяна на гуми', S.fromTrip ? 'trip' : 'home');
    const c = carById(S.sel);
    let h = carSelect();
    if (c && c.allSeason) return h + `<div class="calc">🌦️ Колата е с всесезонни гуми и не се сменя сезонно.</div>`;
    if (c && !c.sets[other(c.mounted)]) {
      h += `<div class="calc" style="background:var(--badbg)">Колата няма ${SETN[other(c.mounted)].toLowerCase()} гуми. Първо добави комплект.</div>
        <button class="btn" onclick="go('newTires',{nk:'${other(c.mounted)}'})">+ Добави ${SETN[other(c.mounted)].toLowerCase()} гуми</button>`;
    } else if (c) {
      const put = other(c.mounted);
      h += `<div class="calc">Сваляме <b>${SETN[c.mounted].toLowerCase()}</b> (${c.sets[c.mounted].tread} мм), слагаме <b>${SETN[put].toLowerCase()}</b> (${c.sets[put].tread} мм)<br>Последно: ${(c.km || 0).toLocaleString('bg-BG')} км</div>
        <div class="row"><div><label for="f_date">Дата</label><input type="date" id="f_date" value="${todayStr()}"></div><div><label for="f_srv">Сервиз</label><select id="f_srv" onchange="S.billSvc=this.value;$('bill').innerHTML=billRows(this.value,S.billBase)">${opts(DB.services, S.billSvc || c.service)}</select></div></div>
        <label for="f_km">Километри</label><input id="f_km" inputmode="numeric" value="${kmMan(c) ? '' : (c.odo || '')}" placeholder="${kmMan(c) ? 'км от таблото' + (c.km ? ', над ' + c.km.toLocaleString('bg-BG') : '') : ''}"><div class="mut" style="margin-top:4px">${kmMan(c) ? (c.manual ? 'Колата не е в пътната книжка' : 'В пътната книжка още няма км') + ' — въведи км от таблото.' : 'Попълнено от пътната книжка. С ' + SETN[c.mounted].toLowerCase() + ' са изминати ' + kmFmt(kmOf(c, c.mounted)) + '.'}</div>
        <div class="row"><div><label for="f_on">Протектор ${SETN[put].toLowerCase()} (мм)</label><input id="f_on" inputmode="decimal" value="${c.sets[put].tread}"></div>
        <div><label for="f_off">Протектор ${SETN[c.mounted].toLowerCase()} (мм)</label><input id="f_off" inputmode="decimal" placeholder="измери"></div></div>
        <label class="chk" style="border:0"><input type="checkbox" id="f_rot" ${rotLeft(c, put) <= 3000 ? 'checked' : ''}> 🔄 Ротация при монтажа (предни ↔ задни)<span class="mut" style="margin-left:auto">${SETN[put].toLowerCase()}: ${rotTxt(rotLeft(c, put))}</span></label>
        <label>Какво е правено</label><div class="card bill" id="bill">${billRows(S.billSvc || c.service, c.sets[put].rims ? 'rims' : 'norims')}</div>
        <label for="f_note">Бележка</label><textarea id="f_note" placeholder="напр. сменен вентил, баланс"></textarea>
        <button class="btn" style="background:var(--org)" onclick="saveChange()">Запиши смяната</button>`;
    }
    return h;
  },

  expense() {
    header('Разход', 'home');
    return carSelect() + `<div class="row"><div><label for="f_type">Вид</label><select id="f_type"><option value="repair">Ремонт</option><option value="buy">Нови гуми</option><option value="other">Друго</option></select></div>
      <div><label for="f_date">Дата</label><input type="date" id="f_date" value="${todayStr()}"></div></div>
      <label for="f_text">Какво</label><input id="f_text" placeholder="напр. спукана гума, 4 бр. зимни 205/55 R16">
      <div class="row"><div><label for="f_srv">Сервиз</label><select id="f_srv">${opts(DB.services)}</select></div><div><label for="f_cost">Сума (€)</label><input id="f_cost" inputmode="decimal"></div></div>
      <button class="btn" style="background:var(--bad)" onclick="saveExpense()">Запиши разхода</button>`;
  },

  cars() {
    header('Коли', 'home');
    const q = S.q.toLowerCase();
    const f = { all: () => true, todo: isTodo, wait: c => !c.allSeason && c.mounted !== TARGET, low: c => issues(c).length, rot: c => rotDue(c) != null };
    const list = DB.cars.filter(f[S.tab]).filter(c => !S.size || c.size === S.size).filter(c => !q || [c.plate, c.model, c.driver].join(' ').toLowerCase().includes(q)).sort((a, b) => a.plate.localeCompare(b.plate));
    let h = (canEdit() ? `<div class="row" style="margin-bottom:12px"><button class="btn" style="margin:0" onclick="go('newCar')">+ Кола</button><button class="btn sec" style="margin:0" onclick="refreshRoad()">🔄 Обнови</button></div><button class="btn sec" style="margin:0 0 12px" onclick="go('bulkSvc',{bsel:[]})">🔧 Сервиз за няколко коли</button><div class="mut" style="margin:-4px 0 12px">Колите от пътната книжка идват сами (🔄 Обнови ги взима веднага). С „+ Кола“ добавяш само коли, които ги няма там.</div>` : '') + `<input class="search" id="f_q" placeholder="Търси по номер, модел, шофьор…" value="${esc(S.q)}" oninput="S.q=this.value;render();$('f_q').focus();$('f_q').setSelectionRange(this.value.length,this.value.length)">
      <label for="f_sz" style="margin-top:0">Размер</label><select id="f_sz" style="margin-bottom:4px" onchange="S.size=this.value;render()"><option value="">Всички размери</option>${sizeList().map(x => `<option value="${esc(x.size)}" ${S.size === x.size ? 'selected' : ''}>${esc(x.size)} (${x.cars} коли)</option>`).join('')}</select>
      <div class="tabs">${[['all', 'Всички']].concat(DB.cars.some(isTodo) ? [['todo', 'Нови']] : [], [['wait', 'Смяна'], ['low', 'Проблеми'], ['rot', 'Ротация']]).map(t => `<button class="${S.tab === t[0] ? 'on' : ''}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
      <div class="mut" style="margin-bottom:8px">${list.length} ${list.length === 1 ? 'кола' : 'коли'}${S.size ? ' с размер ' + esc(S.size) : ''}</div>${canEdit() ? roadDiag() : ''}`;
    return h + (list.length ? carGrid(list, c => carTile(c, sub_(c.size, c.driver))) : '<div class="center">Няма коли</div>');
  },

  car() {
    const c = carById(S.sel); if (!c) return go('cars');
    header(c.plate, 'cars');
    const it = itemOf(c.id), t = tripOf(c.id);
    const where = k => {
      if (k === c.mounted) return '<span class="badge b-ok">На колата</span>';
      if (it && k === TARGET && it.step === 1) return `<span class="badge b-warn">В ${esc(t.bus)}</span>`;
      if (it && k !== TARGET && it.step === 2) return `<span class="badge b-warn">В ${esc(t.service)}</span>`;
      return '<span class="badge b-soft">В склада</span>';
    };
    const setCard = k => {
      const s = c.sets[k], ico = ICO[k];
      if (!s) return `<div class="set miss"><div class="hd"><span>${ico} ${SETN[k]}</span><span class="badge b-bad">Няма комплект</span></div>
        <div class="mut">Трябват 4 гуми ${esc(c.size)}</div>${canEdit() ? `<div class="setbtns"><button onclick="go('newTires',{nk:'${k}'})">+ Добави ${SETN[k].toLowerCase()} гуми</button></div>` : ''}</div>`;
      const st = treadState(s, k), w = Math.min(100, Math.round(numv(s.tread) / 9 * 100));
      const col = st === 'bad' ? 'var(--bad)' : st === 'warn' ? 'var(--warn)' : (k === 'winter' ? 'var(--win)' : 'var(--org)');
      const n = need(s), hv = have(s);
      return `<div class="set ${k === c.mounted ? 'mnt' : ''} ${k === 'summer' ? 'sum' : ''}"><div class="hd"><span>${ico} ${SETN[k]} · ${hv}/4 бр.</span>${where(k)}</div>
        <div class="mut">${setLine(s)}${canEdit() ? ` · <button class="elink" onclick="go('editSet',{nk:'${k}'})">✏️ Редактирай</button>` : ''}</div>
        <div class="setmeta"><button class="rimb ${s.rims ? 'on' : ''}" ${canEdit() ? '' : 'disabled'} onclick="toggleRims('${c.id}','${k}')">${s.rims ? '🛞 На джанти' : '○ Без джанти'}</button><span>🛣️ Изминати <b>${kmFmt(kmOf(c, k))}</b></span></div>
        ${(() => { const l = rotLeft(c, k), col = l < 0 ? 'var(--bad)' : l <= 1000 ? 'var(--warn)' : 'var(--mut)'; return `<div class="setmeta"><span>🔄 Ротация: <b style="color:${col}">${rotTxt(l)}</b>${k === c.mounted ? '' : ' каране'}</span>${canEdit() ? `<button class="rimb ${S.confirmRot === c.id + k ? 'cfmr' : ''}" onclick="rotate('${c.id}','${k}')">${S.confirmRot === c.id + k ? '✔ Потвърди ротацията' : 'Направих ротация'}</button>` : ''}</div>`; })()}
        <div class="tread"><i style="width:${w}%;background:${col}"></i></div>
        <div class="mut">Протектор <b style="color:${col}">${s.tread} мм</b> · лимит ${LIMIT[k]} мм</div>
        <div class="axle">${s.tires.map((t, i) => `<button class="tire ${t}" style="grid-column:${i % 2 ? 3 : 1};grid-row:${i < 2 ? 1 : 2}" aria-label="${POSF[i]}: ${TST[t]}" ${canEdit() ? '' : 'disabled'} onclick="cycleTire('${c.id}','${k}',${i})">${POS[i]}<span>${TST[t]}</span></button>`).join('')}<div class="body">${CAR_SVG}</div></div>
        ${n && canEdit() ? `<div class="setbtns"><button onclick="go('newTires',{nk:'${k}'})">+ Нови гуми (${n} бр.)</button></div>` : ''}</div>`;
    };
    const editCard = canEdit() ? `<div class="card" style="display:flex;flex-direction:column;gap:2px"><b style="font-size:14px">Данни за колата</b>
        <div class="row"><div><label for="e_size">Размер на гумите</label><input id="e_size" list="sizes3" value="${esc(c.size)}" placeholder="напр. 205/55 R16"></div><div><label for="e_srv">Сервиз</label><select id="e_srv">${opts(DB.services, c.service)}</select></div></div>
        <label for="e_vt">Вид кола (за цената на смяната)</label><select id="e_vt"><option value="">Автоматично — ${VT[vtypeAuto(c)]}</option>${['car', 'suv', 'van'].map(t => `<option value="${t}" ${c.vtype === t ? 'selected' : ''}>${VT[t]}</option>`).join('')}</select>
        ${c.allSeason ? '' : `<label for="e_mnt">Кои гуми са на колата сега</label><select id="e_mnt"><option value="summer" ${c.mounted === 'summer' ? 'selected' : ''}>Летни</option><option value="winter" ${c.mounted === 'winter' ? 'selected' : ''}>Зимни</option></select>`}
        ${c.manual ? `<div class="row"><div><label for="e_model">Модел</label><input id="e_model" value="${esc(c.model)}"></div><div><label for="e_drv">Шофьор</label><input id="e_drv" value="${esc(c.driver)}"></div></div>` : '<div class="mut" style="margin-top:6px">Модел, шофьор и км идват от пътната книжка.</div>'}
        <datalist id="sizes3">${sizeList().map(x => `<option value="${esc(x.size)}">`).join('')}</datalist>
        <button class="btn" style="margin-top:10px" onclick="saveCarEdit('${c.id}')">Запази данните</button></div>` : '';
    let h = `<div class="card hero">${plateHtml(c.plate, true)}<div class="mut">${esc(c.model)} · ${esc(c.size)}</div><div class="tb" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">${carBadges(c).replace('class="bdg"', 'style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"')}</div></div>
      <div class="card"><div class="kv"><span>Модел</span><b>${esc(c.model)}</b></div><div class="kv"><span>Размер</span><b>${esc(c.size)}</b></div><div class="kv"><span>${kmMan(c) ? 'Км (въведени ръчно)' : 'Км по пътната книжка'}</span><b>${(c.odo || c.km || 0).toLocaleString('bg-BG')}</b></div><div class="kv"><span>Шофьор</span><b>${esc(c.driver)}</b></div><div class="kv"><span>Сервиз</span><b>${esc(c.service)}</b></div><div class="kv"><span>Км при последна смяна</span><b>${(c.km || 0).toLocaleString('bg-BG')}</b></div></div>
      ${kmMan(c) ? `<div class="calc">${c.manual ? 'Колата не е в пътната книжка.' : 'В пътната книжка още няма км за тази кола.'} Км се пишат при смяна${canEdit() ? ' или тук:' : '.'}${canEdit() ? `<div class="row" style="margin-top:8px"><input id="f_upkm" inputmode="numeric" placeholder="км от таблото"><button class="btn" style="margin:0" onclick="updateKm('${c.id}')">Обнови км</button></div>` : ''}</div>` : ''}
      ${!c.size ? editCard : ''}
      ${c.allSeason ? setCard('all') : setCard(c.mounted) + setCard(other(c.mounted))}
      ${canEdit() ? `<div class="card" style="display:flex;flex-direction:column;gap:8px"><b style="font-size:14px">Вид гуми</b><div class="tabs" style="margin:0">${[[false, '☀️❄️ Летни + зимни'], [true, '🌦️ Всесезонни']].map(([v, l]) => `<button class="${!!c.allSeason === v ? 'on' : ''}" onclick="setAllSeason('${c.id}',${v})">${l}</button>`).join('')}</div>${S.confirmAS === c.id ? `<div class="calc" style="background:var(--warnbg);color:var(--warntx)">Сегашните гуми отиват в свободни. <button class="btn cfm" style="margin-top:8px" onclick="setAllSeason('${c.id}',${!c.allSeason},1)">✔ Потвърди</button></div>` : ''}</div>` : ''}
      ${c.size ? editCard : ''}
      ${canEdit() ? '<div class="mut" style="margin:-2px 0 6px">Натисни гума, за да смениш състоянието: годна → за смяна → брак.</div>' : ''}`;
    if (canEdit()) h += `<div class="row"><button class="btn" style="background:var(--org);margin-top:4px" onclick="go('change',{fromTrip:''})">🔧 Смяна</button><button class="btn sec" style="margin-top:4px" onclick="go('expense')">🧾 Разход</button></div>
      ${c.manual ? `<button class="btn ${S.confirmRm === c.id ? 'cfm' : 'sec'}" style="margin-top:8px;font-size:14px" onclick="removeCar('${c.id}')">${S.confirmRm === c.id ? 'Натисни пак: гумите отиват в свободни' : 'Премахни колата'}</button>` : ''}`;
    const hs = DB.history.filter(x => x.carId === c.id).sort((a, b) => b.date.localeCompare(a.date));
    const tot = hs.reduce((a, x) => a + (x.cost ? numv(x.cost) : 0), 0);
    const yr = hs.filter(x => x.date >= YEAR + '-01-01').reduce((a, x) => a + (x.cost ? numv(x.cost) : 0), 0);
    h += `<h2>История · разходи ${eur(yr)} тази година · ${eur(tot)} общо</h2><div class="card">` + hs.map(x => `<div class="hist"><div class="d">${fmt(x.date)}</div><div style="flex:1">${esc(x.text)}${x.service ? ' · ' + esc(x.service) : ''}${x.km ? `<div class="mut">${Number(x.km).toLocaleString('bg-BG')} км</div>` : ''}${x.note ? `<div class="mut">${esc(x.note)}</div>` : ''}</div><div class="mut">${x.cost ? eur(x.cost) : ''}</div></div>`).join('') + '</div>';
    return h;
  },

  store() {
    header('Склад', 'home');
    const inStore = k => DB.cars.filter(c => {
      if (!c.sets[k] || c.mounted === k) return false;
      const it = itemOf(c.id);
      if (it && k === TARGET && it.step >= 1) return false;
      if (it && k !== TARGET && it.step === 2) return false;
      return true;
    });
    const w = inStore('winter'), s = inStore('summer'), fr = DB.free;
    const tab = S.stab || 'winter';
    let h = statGrid([
      ['❄️ Зимни в склада', w.length + '<small>к-та</small>', '', 'var(--win)'],
      ['☀️ Летни в склада', s.length + '<small>к-та</small>', '', 'var(--org)'],
      ['📦 Свободни гуми', fr.reduce((a, f) => a + f.tires.length, 0) + '<small>бр.</small>', fr.length + ' комплекта, без кола', 'var(--teal)']
    ]) + `
      <div class="tabs">${[['winter', '❄️ Зимни ' + w.length], ['summer', '☀️ Летни ' + s.length], ['free', '📦 Свободни ' + fr.length]].map(t => `<button class="${tab === t[0] ? 'on' : ''}" onclick="S.stab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>`;
    if (tab === 'free') {
      h += `<div class="mut" style="margin-bottom:8px">Гуми без кола: от махнати коли или купени резервни. Остават тук, докато не ги дадеш на кола или не ги премахнеш.</div>`;
      if (canEdit()) h += `<button class="btn" style="margin:0 0 12px;background:var(--teal)" onclick="go('addFree')">+ Добави свободни гуми</button>`;
      return h + (fr.length ? `<div class="szgrid">${fr.map(freeCard).join('')}</div>` : '<div class="card mut">Няма свободни гуми.</div>');
    }
    const L = tab === 'winter' ? w : s;
    h += `<div class="mut" style="margin-bottom:6px">Гумите са надписани с номера на колата, затова се търсят по номер.</div>`;
    return h + carGrid(L.sort((a, b) => a.plate.localeCompare(b.plate)), c => { const x = setIssue(c, tab); return carTile(c, `${c.sets[tab].brand} · ${have(c.sets[tab])}/4 бр. · ${c.sets[tab].tread} мм · ${c.sets[tab].rims ? 'джанти' : 'без джанти'}`, x ? `<span class="badge b-${x.lvl}">${x.txt}</span>` : '<span class="badge b-ok">годни</span>'); });
  },

  profile() {
    header('Профил', 'home');
    return `<div class="card"><div class="kv"><span>Име</span><b>${esc(USER.name)}</b></div><div class="kv"><span>Потребител</span><b>${esc(USER.username || '—')}</b></div><div class="kv"><span>Права</span><b>${ROLE[USER.role]}</b></div></div>
      <h2>${USER.hasPass ? 'Смяна на парола' : 'Задай потребител и парола'}</h2><div class="card">

      <label for="p_user">Потребителско име</label><input id="p_user" value="${esc(USER.username || '')}" autocapitalize="none" autocorrect="off" autocomplete="username" placeholder="напр. ivan">

  settings() {
    header('Настройки', 'report');
    const T = S.set;
    const list = (key, label, ph) => `<h2>${label}</h2><div class="card">${T[key].map((x, i) => `<div class="srow"><input value="${esc(x.name)}" placeholder="${ph}" oninput="S.set.${key}[${i}].name=this.value" aria-label="${label} ${i + 1}">${T[key].length > 1 ? `<button class="sdel" onclick="S.set.${key}.splice(${i},1);render()" aria-label="Махни">✕</button>` : ''}</div>`).join('')}
      <button class="btn sec" style="margin-top:8px" onclick="S.set.${key}.push({old:'',name:''});render()">+ Добави</button></div>`;
    let h = list('services', 'Сервизи', 'Име на сервиза') + list('buses', 'Бусове', 'напр. Бус 1 или номер');
    h += `<h2>Уговорени цени за смяна (общо за колата)</h2><div class="mut" style="margin:-4px 0 8px">Цена за цялата кола според размера на джантата. Празно = ползва се общата цена отдолу.</div>${(+DB.version || 0) < 7 ? '<div class="calc" style="background:var(--badbg)">⚠️ Сървърът е стара версия — първо сложи новия код в Apps Script (версия 7), иначе цените по размер няма да се запазят.</div>' : ''}`;
    h += T.services.filter(x => x.name).map(x => { const key = x.old || x.name; const P = T.prices[key] = T.prices[key] || { norims: 0, rims: 0 };
      return `<div class="card"><b>${esc(x.name)}</b>${gridHtml(key)}<div class="bxl" style="margin-top:12px">Обща цена (за размер без цена горе)</div>${['norims', 'rims'].map(k => `<div class="prow"><div style="flex:1;min-width:0">${BASE[k]}<div class="mut">${k === 'rims' ? 'гумите са на джанти' : 'гумите са без джанти'}</div></div>
        <input class="bp" inputmode="decimal" value="${P[k]}" oninput="S.set.prices['${esc(key)}'].${k}=this.value" aria-label="${BASE[k]} ${esc(x.name)}"><span class="bx">€</span></div>`).join('')}</div>`; }).join('');
    h += `<h2>Допълнителни услуги за отметване</h2><div class="card">${T.extras.map((x, i) => `<div class="srow"><input value="${esc(x)}" oninput="S.set.extras[${i}]=this.value" aria-label="Услуга ${i + 1}"><button class="sdel" onclick="S.set.extras.splice(${i},1);render()" aria-label="Махни">✕</button></div>`).join('')}
      <button class="btn sec" style="margin-top:8px" onclick="S.set.extras.push('');render()">+ Добави</button></div>`;
    h += `<button class="btn" onclick="saveSettings()">Запази настройките</button>`;
    if (!S.users) api('users').then(u => { S.users = u; if (S.view === 'settings') $('usersBox').innerHTML = usersHtml(); }).catch(e => toast(e.message, 1));
    return h + `<h2>Потребители</h2><div class="card" id="usersBox">${usersHtml()}</div>`;
  },

  offer() {
    header('Запитване за оферта', 'report');

      <div class="card">${O.rows.map((r, i) => `<div class="ofr${r.on ? '' : ' off'}"><button type="button" class="ofc" onclick="S.of.rows[${i}].on=!S.of.rows[${i}].on;render()" aria-label="Включи ${esc(r.size)}">${r.on ? '✓' : ''}</button>
        <div class="oft" onclick="S.of.rows[${i}].on=!S.of.rows[${i}].on;render()">${ICO[r.k]} <b>${esc(r.size)}</b><div class="mut">${SETN[r.k]}${r.van ? ' · C (бус)' : ''} · ${r.cars} ${r.cars === 1 ? 'кола' : 'коли'}</div></div>

      <div class="row" style="margin-bottom:8px"><button class="btn sec" style="margin:0" onclick="bulkAll(true)">Отметни всички</button><button class="btn sec" style="margin:0" onclick="bulkAll(false)">Махни всички</button></div>
      <div class="card">${L.map(c => `<label class="chk"><input type="checkbox" class="bcar" value="${c.id}" ${c.service === sv ? 'checked' : ''}><span style="flex:1"><b class="plate">${esc(c.plate)}</b> <span class="mut">${esc(c.model)} · сега: ${esc(c.service || '—')}</span></span></label>`).join('')}</div>
      <button class="btn" id="b_save" onclick="saveBulkSvc()">Запази</button>`;

  newCar() {

      <div class="row"><div><label for="f_plate">Номер</label><input id="f_plate" placeholder="В 1234 АВ" autocapitalize="characters"></div><div><label for="f_model">Модел</label><input id="f_model" placeholder="напр. VW Golf"></div></div>
      <label for="f_size">Размер на гумите</label><input id="f_size" list="sizes2" placeholder="напр. 205/55 R16"><datalist id="sizes2">${sizeList().map(x => `<option value="${esc(x.size)}">`).join('')}</datalist>
      <div class="row"><div><label for="f_drv">Шофьор</label><input id="f_drv"></div><div><label for="f_srv">Сервиз</label><select id="f_srv">${opts(DB.services)}</select></div></div>
      <div class="row"><div><label for="f_km">Км сега</label><input id="f_km" inputmode="numeric"></div><div><label for="f_kind">Гуми</label><select id="f_kind"><option value="">Летни + зимни</option><option value="1">Всесезонни</option></select></div></div>
      <button class="btn" onclick="saveCar()">Добави колата</button>`;

  addFree() {

      <label for="f_size">Размер</label><input id="f_size" list="sizes" placeholder="напр. 205/55 R16"><datalist id="sizes">${sizeList().map(x => `<option value="${esc(x.size)}">`).join('')}</datalist>
      <div class="row"><div><label for="f_brand">Марка и модел</label><input id="f_brand"></div><div><label for="f_dot">DOT (година)</label><input id="f_dot" inputmode="numeric" value="2026"></div></div>
      <div class="row"><div><label for="f_tread">Протектор (мм)</label><input id="f_tread" inputmode="decimal" value="8"></div><div><label for="f_kmr">Изминати км</label><input id="f_kmr" inputmode="numeric" placeholder="0 за нови"></div></div>

  assign() {
    const f = DB.free.find(x => x.id === S.fid); if (!f) return go('store', { stab: 'free' });
    header('Дай на кола', 'store');
    const same = DB.cars.filter(c => c.size === f.size && kinds(c).includes(f.k));
    const score = c => !c.sets[f.k] ? 0 : need(c.sets[f.k]) ? 1 : 2;
    same.sort((a, b) => score(a) - score(b) || a.plate.localeCompare(b.plate));
    let h = `<div class="szgrid" style="grid-template-columns:1fr">${freeCard({ ...f, _noBtn: 1 }).replace(/<span class="row2">[\s\S]*?<\/span><\/div>$/, '</div>')}</div>
      <h2>Коли с размер ${esc(f.size)} (${same.length})</h2>`;
    if (!same.length) return h + '<div class="card mut">Няма коли с този размер.</div>';
    h += `<div class="szgrid">${same.map(c => {
      const s = c.sets[f.k], n = need(s);
      const state = !s ? `<span class="badge b-bad">Няма ${SETN[f.k].toLowerCase()}</span>` : n ? `<span class="badge b-bad">${have(s)}/4 · за подмяна ${n}</span>` : '<span class="badge b-ok">пълен комплект</span>';
      const btns = !s ? `<button onclick="assign('${c.id}','set')">Сложи</button>`
        : n ? `<button onclick="assign('${c.id}','fill')">Допълни ${Math.min(n, f.tires.length)}</button><button class="sec" onclick="assign('${c.id}','set')">Замени</button>`
        : `<button class="sec" onclick="assign('${c.id}','set')">Замени</button>`;
      return `<div class="szc fset" style="cursor:default;--acc:${!s || n ? 'var(--bad)' : 'var(--line)'}">${plateHtml(c.plate)}<span class="mut">${esc(c.model)}</span>${state}<span class="row2">${btns}</span></div>`;
    }).join('')}</div><div class="mut" style="margin-top:8px">„Замени“ връща стария комплект в свободни гуми.</div>`;
    return h;
  },

  newTires() {
    const c = carById(S.sel); if (!c) return go('cars');
    const k = kinds(c).includes(S.nk) ? S.nk : kinds(c)[0], s = c.sets[k];
    const ex = !s && S.exist !== false;   // първо въвеждане: по подразбиране са гумите, които колата вече има
    header((ex ? 'Гуми · ' : 'Нови гуми · ') + c.plate, 'car');
    let h = !s ? `<div class="tabs">${[[true, 'Гумите, които има'], [false, 'Купени нови']].map(([v, l]) => `<button class="${ex === v ? 'on' : ''}" onclick="S.exist=${v};render()">${l}</button>`).join('')}</div>` : '';
    h += `<div class="calc">${s ? `${SETN[k]}: ${have(s)}/4 годни, ${need(s)} за подмяна (${s.tires.map((t, i) => t !== 'ok' ? POS[i] + ' ' + TST[t].toLowerCase() : '').filter(Boolean).join(', ')})`
      : ex ? `Въведи ${SETN[k].toLowerCase()}те гуми, които колата вече има. После с натискане на гума отбелязваш коя е за смяна или брак.` : `Колата няма ${SETN[k].toLowerCase()} гуми — добавяш нов комплект.`}</div>
      <div class="row"><div><label for="f_k">Комплект</label><select id="f_k" onchange="S.nk=this.value;render()">${kinds(c).map(x => `<option value="${x}" ${k === x ? 'selected' : ''}>${SETN[x]}</option>`).join('')}</select></div>
      <div><label for="f_n">Брой</label><input id="f_n" inputmode="numeric" value="${s ? need(s) : 4}"></div></div>
      <label for="f_size">Размер</label><input id="f_size" list="sizes4" value="${esc(s ? s.size : c.size)}" placeholder="напр. 205/55 R16"><datalist id="sizes4">${sizeList().map(x => `<option value="${esc(x.size)}">`).join('')}</datalist>
      <div class="row"><div><label for="f_brand">Марка и модел</label><input id="f_brand" placeholder="напр. Michelin Alpin 6"></div><div><label for="f_dot">DOT (година)</label><input id="f_dot" inputmode="numeric" value="${ex ? '' : YEAR}" placeholder="напр. 2022"></div></div>`;
    h += ex ? `<div class="row"><div><label for="f_tread">Протектор (мм)</label><input id="f_tread" inputmode="decimal" placeholder="напр. 6.5"></div><div><label for="f_kmr">Изминати км</label><input id="f_kmr" inputmode="numeric" placeholder="ако знаеш"></div></div>`
      : `<div class="row"><div><label for="f_date">Дата</label><input type="date" id="f_date" value="${todayStr()}"></div><div><label for="f_cost">Сума (€)</label><input id="f_cost" inputmode="decimal"></div></div>`;
    return h + `<label class="chk" style="border:0"><input type="checkbox" id="f_rims" ${s && s.rims ? 'checked' : ''}> На джанти</label>
      <button class="btn" onclick="saveTires(${ex})">${ex ? 'Запиши гумите' : 'Запиши новите гуми'}</button>`;
  },

  report() {
    header('Справка', 'home');
    const tot = DB.cars.length, win = DB.cars.filter(c => c.mounted === 'winter' || c.allSeason).length;
    const full = DB.cars.filter(c => kinds(c).every(k => !need(c.sets[k]))).length;
    const allSets = DB.cars.flatMap(c => kinds(c).filter(k => c.sets[k]).map(k => ({ c, k, s: c.sets[k] })));
    const old = allSets.filter(x => ageOf(x.s) >= 6).length, rims = allSets.filter(x => x.s.rims).length;
    const Y0 = YEAR + '-01-01', hy = DB.history.filter(x => x.date >= Y0);
    const costAll = hy.reduce((a, x) => a + (x.cost ? numv(x.cost) : 0), 0);
    let h = statGrid([
      ['Готови за зимата', win + '<small>/ ' + tot + '</small>', 'зимни или всесезонни', 'var(--win)'],
      ['Пълни и годни', full + '<small>/ ' + tot + '</small>', 'без липси, брак и износване', 'var(--ok)'],
      ['Над 6 години', old + '<small>к-та</small>', 'по DOT', old ? 'var(--warn)' : 'var(--ok)'],
      ['На джанти', rims + '<small>/ ' + allSets.length + '</small>', 'комплекта', 'var(--teal)'],

      <h2>Сравнение на сервизите · ${YEAR}</h2>`;
    h += statGrid(DB.services.map(sv => {
      const hs = hy.filter(x => x.service === sv), ch = hs.filter(x => x.type === 'change');
      const chCost = ch.reduce((a, x) => a + (x.cost ? numv(x.cost) : 0), 0), cost = hs.reduce((a, x) => a + (x.cost ? numv(x.cost) : 0), 0);
      return ['🔧 ' + esc(sv), eur(ch.length ? chCost / ch.length : 0).replace(' €', '') + '<small>€ / смяна</small>', `${ch.length} смени · ${hs.length - ch.length} ремонта · общо ${eur(cost)}`, 'var(--vio)'];
    }));
    // износване по марка: мм на 10 000 км
    const br = {};
    allSets.forEach(({ c, k, s }) => { const km = kmOf(c, k); if (km < 5000) return; const r = (NEWD[k] - numv(s.tread)) / km * 10000; if (r <= 0) return; const x = br[s.brand] = br[s.brand] || { k, n: 0, sum: 0 }; x.n++; x.sum += r; });
    const BL = Object.entries(br).map(([b, x]) => ({ b, k: x.k, rate: x.sum / x.n, n: x.n, life: (NEWD[x.k] - (x.k === 'summer' ? 3 : 4)) / (x.sum / x.n) * 10000 })).sort((a, b) => a.rate - b.rate);
    if (BL.length) {
      h += `<h2>Износване по марка</h2><div class="szgrid">${BL.map((x, i) => `<div class="szc" style="cursor:default;--acc:${i === 0 ? 'var(--ok)' : i === BL.length - 1 ? 'var(--bad)' : 'var(--line)'}">
        <span class="sz">${ICO[x.k]} ${esc(x.b)}</span><span class="n" style="font-size:24px">${x.rate.toFixed(2)}<small>мм / 10 000 км</small></span>
        <span class="mut">издържа ≈ ${Math.round(x.life / 1000)} 000 км · ${x.n} к-та</span></div>`).join('')}</div>
        <div class="mut" style="margin-top:6px">Изчислено от протектора и изминатите км по пътната книжка. Живот до ${LIMIT.winter} мм за зимни и 3 мм за летни.</div>`;
    }
    const pc = DB.cars.map(c => ({ c, v: hy.filter(x => x.carId === c.id).reduce((a, x) => a + (x.cost ? numv(x.cost) : 0), 0) })).sort((a, b) => b.v - a.v).slice(0, 6);
    h += `<h2>Най-скъпи коли · ${YEAR}</h2>` + carGrid(pc.map(x => x.c), c => carTile(c, eur(pc.find(x => x.c === c).v) + ' тази година', ''));
    h += `<h2>Коли по размер гуми</h2>${sizesCard()}`;
    h += `<button class="btn" onclick="exportPDF()">📄 Свали справката като PDF</button><button class="btn sec" onclick="exportCSV()">⬇ Свали за Excel (CSV)</button>`;
    if (isAdmin()) h += `<button class="btn" onclick="openSettings()">⚙️ Настройки: сервизи, бусове, цени</button>`;
    return h;
  }
};

async function exportPDF() { return makePDF(pdfHtml(), 'gumi-spravka-' + todayStr() + '.pdf'); }

    try {
      await html2pdf().set({ margin: [8, 8, 10, 8], filename, image: { type: 'jpeg', quality: 0.95 }, html2canvas: { scale: 2, backgroundColor: '#ffffff' }, jsPDF: { unit: 'mm', format: 'a4' }, pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', 'h3', '.bx'] } }).from(el).save();

async function boot() {
  if (API_URL.indexOf('http') !== 0) return showMsg('Липсва адресът на сървъра. Отвори index.html и попълни API_URL.');
  if (new URLSearchParams(location.search).get('t')) history.replaceState(null, '', location.pathname);
